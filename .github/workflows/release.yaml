name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.7.14
  IMAGE_REPOSITORY: ghcr.io/acidghost/k8s-crondash
  CHART_REPOSITORY: ghcr.io/acidghost/charts/k8s-crondash

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag and normalize version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Release ref must be a tag" >&2
            exit 1
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "Tag must be strict SemVer of the form vMAJOR.MINOR.PATCH[-PRERELEASE]: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" == "0.0.0" ]]; then
            echo "0.0.0 is a development placeholder and must never be published" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure artifact versions do not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assert_absent() {
            local reference="$1" output status
            set +e
            output="$(docker buildx imagetools inspect "$reference" 2>&1)"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              echo "Refusing to overwrite existing immutable artifact: $reference" >&2
              exit 1
            fi
            if ! grep -Eqi 'not found|manifest unknown|does not exist' <<<"$output"; then
              echo "Could not establish that $reference is absent:" >&2
              echo "$output" >&2
              exit 1
            fi
            echo "Available: $reference"
          }
          assert_absent "${IMAGE_REPOSITORY}:${VERSION}"
          assert_absent "${CHART_REPOSITORY}:${VERSION}"

  publish-image:
    name: Publish image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/acidghost/k8s-crondash
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/acidghost/k8s-crondash
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Inspect BuildKit attestations and prepare SPDX predicates
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE_REPOSITORY}@${DIGEST}"
          docker buildx imagetools inspect "$reference" --format '{{ json .Provenance }}' > provenance.json
          docker buildx imagetools inspect "$reference" --format '{{ json .SBOM }}' > sbom.json

          for platform in linux/amd64 linux/arm64; do
            jq -e \
              --arg platform "$platform" \
              --arg commit "$GITHUB_SHA" \
              --arg source "https://github.com/${GITHUB_REPOSITORY}" \
              --arg version "$VERSION" '
                .[$platform].SLSA |
                .buildDefinition.buildType ==
                  "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" and
                .buildDefinition.externalParameters.request.root.request.args["build-arg:BUILD_COMMIT"] == $commit and
                .buildDefinition.externalParameters.request.root.request.args["build-arg:BUILD_VERSION"] == $version and
                .buildDefinition.externalParameters.request.root.request.args["vcs:source"] == $source and
                (.runDetails.builder.id | type == "string" and length > 0)
              ' provenance.json >/dev/null

            output="sbom-${platform//\//-}.spdx.json"
            jq -e --arg platform "$platform" '.[$platform].SPDX' sbom.json > "$output"
          done

      - name: Sign image and attest platform SBOMs by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE_REPOSITORY}@${DIGEST}"
          cosign sign --yes "$reference"
          for predicate in sbom-linux-amd64.spdx.json sbom-linux-arm64.spdx.json; do
            cosign attest --yes --type spdxjson --predicate "$predicate" "$reference"
          done

      - name: Verify image signature and signed SBOM attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE_REPOSITORY}@${DIGEST}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$reference" >/dev/null
          cosign verify-attestation \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            --type spdxjson \
            "$reference" > verified-sbom-attestations.jsonl

          expected_namespaces="$(
            jq -s 'map(.documentNamespace) | sort' \
              sbom-linux-amd64.spdx.json sbom-linux-arm64.spdx.json
          )"
          jq -s -e --argjson expected "$expected_namespaces" '
            map(.payload | @base64d | fromjson) |
            map(
              select(.predicateType == "https://spdx.dev/Document") |
              .predicate.documentNamespace
            ) |
            sort == $expected
          ' verified-sbom-attestations.jsonl >/dev/null

  publish-chart:
    name: Publish chart
    needs: [metadata, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - run: just helm-lint
      - run: just helm-conform

      - name: Package and inspect exact chart version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          just helm-package version="$VERSION"
          archive="build/k8s-crondash-${VERSION}.tgz"
          metadata="$(helm show chart "$archive")"
          chart_version="$(awk '$1 == "version:" {print $2}' <<<"$metadata")"
          app_version="$(awk '$1 == "appVersion:" {print $2}' <<<"$metadata")"
          [[ "$chart_version" == "$VERSION" ]]
          [[ "$app_version" == "$VERSION" ]]

      - name: Push exact chart version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: just helm-push version="$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart
          path: build/k8s-crondash-${{ needs.metadata.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub release
    needs: [metadata, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: helm-chart
          path: build

      - name: Create release with packaged chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do (idempotent)."
            exit 0
          fi
          args=(
            --target "$SHA"
            --verify-tag
            --generate-notes
            --title "$TAG"
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "build/k8s-crondash-${VERSION}.tgz" "${args[@]}"
